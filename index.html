<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAIT | Equipment Index</title>
<meta name="description" content="Internal equipment selector for TAIT and Kinesys automation products: winches, chain hoists, drives, control, load cells, tracking and more.">
<meta property="og:type" content="website">
<meta property="og:title" content="TAIT | Equipment Index">
<meta property="og:description" content="Find the right Kinesys or TAIT Classic product by brand, capacity, speed, rating and duty.">
<link rel="manifest" href="site.webmanifest">
<style>
:root{
  --bg:#F5F5F7; --surface:rgba(255,255,255,.86); --surface-strong:#FFFFFF; --surface-muted:#F1F1F3;
  --ink:#0A0A0B; --ink-soft:#343437; --muted:#6E6E73; --muted-2:#8D8D92;
  --gray-01:#E3E3E3; --gray-02:#AFAFAF; --gray-03:#636466; --gray-04:#282829;
  --line:rgba(0,0,0,.085); --line-strong:rgba(0,0,0,.16);
  --yellow:#DBFF00; --green:#00FF57; --magenta:#FF35FF; --blue:#2E4FFF; --red:#FF4308;
  --radius-sm:11px; --radius-md:16px; --radius-lg:22px; --radius-xl:30px;
  --shadow-soft:0 8px 26px rgba(0,0,0,.055); --shadow:0 18px 55px rgba(0,0,0,.08);
  --focus:0 0 0 4px rgba(46,79,255,.14);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
input,select{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 80px}
.head{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px}
.logo{font-weight:900;letter-spacing:-.02em;font-size:24px;background:#000;color:#fff;padding:6px 14px;border-radius:8px}
.head h1{font-size:18px;margin:0;font-weight:700}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.workspace{margin-top:22px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navbtn{display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-radius:var(--radius-lg);background:transparent;
  text-align:left;transition:background .25s var(--ease)}
.navbtn:hover{background:var(--surface-muted)}
.navbtn.active{background:#fff;box-shadow:var(--shadow-soft)}
.navbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--gray-02);margin-right:12px;display:inline-block}
.navbtn.active .dot{background:#000}
.navbtn .label{flex:1;font-weight:600}
.navbtn .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.context{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between}
.context h2{margin:0;font-size:20px;font-weight:700}
.context p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:420px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:11px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;
  transition:background .2s var(--ease)}
.btn:hover{background:var(--surface-muted)}
.btn.primary{background:#000;color:#fff;border-color:#000}
.btn.primary:hover{background:#1a1a1a}
.panel{margin-top:28px;background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-soft);padding:24px 24px 18px}
.filters{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input[type=text], .field select{
  padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:#fff;
  outline:none;transition:box-shadow .2s var(--ease)}
.field input[type=text]:focus, .field select:focus{box-shadow:var(--focus);border-color:#000}
.col-4{grid-column:span 4} .col-3{grid-column:span 3} .col-6{grid-column:span 6} .col-12{grid-column:span 12}
@media (max-width:820px){ .col-4,.col-3,.col-6{grid-column:span 12} }
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface-muted);font-size:12px;font-weight:600;color:var(--ink-soft);
  border:1px solid transparent;transition:all .2s var(--ease)}
.chip:hover{background:#eaeaee}
.chip.active{background:#000;color:#fff;border-color:#000}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input[type=range]{flex:1}
.range-val{font-variant-numeric:tabular-nums;font-weight:700;min-width:90px;text-align:right}
.summary{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.summary .count{font-size:13px;color:var(--muted)}
.summary .count b{color:var(--ink);font-weight:700}
.results{margin-top:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:820px){ .results{grid-template-columns:1fr} }
.card{background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-soft);padding:22px;
  display:flex;flex-direction:column;gap:14px;transition:transform .25s var(--ease), box-shadow .25s var(--ease);position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .cat{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card .brand-pill{position:absolute;top:18px;right:20px;font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
.brand-pill.kinesys{background:#DBFF00;color:#000}
.brand-pill.tait{background:#000;color:#fff}
.brand-pill.generic{background:var(--surface-muted);color:var(--muted)}
.card h3{margin:0;font-size:24px;line-height:1.05;font-weight:900;letter-spacing:-.02em;padding-right:90px}
.card .blurb{color:var(--ink-soft);font-size:13.5px;margin:-4px 0 2px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spec{background:var(--surface-muted);border-radius:var(--radius-sm);padding:10px 12px}
.spec .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.spec .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:#0A0A0B;color:#fff}
.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.linklike{font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.verify-flag{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:50}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100%);background:#fff;
  transform:translateX(100%);transition:transform .35s var(--ease);z-index:60;
  display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.18)}
.drawer.open{transform:translateX(0)}
.drawer header{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.drawer h3{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.drawer .body{padding:22px 24px;overflow:auto;flex:1}
.drawer .footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.specs-table{width:100%;border-collapse:collapse;margin-top:10px}
.specs-table td{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.specs-table td:first-child{color:var(--muted);width:42%}
.specs-table td:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.closebtn{width:36px;height:36px;border-radius:50%;background:var(--surface-muted);display:flex;align-items:center;justify-content:center;font-size:18px}
.source-note{margin-top:14px;padding:10px 14px;background:var(--surface-muted);border-radius:var(--radius-sm);font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0A0A0B;color:#fff;padding:12px 20px;border-radius:999px;opacity:0;
  transition:all .3s var(--ease);z-index:80;font-size:13px;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.present{background:#000;color:#fff}
body.present .panel,body.present .card{background:#0F0F11;color:#fff;box-shadow:none}
body.present .spec, body.present .source-note{background:#1a1a1d}
body.present .navbtn.active{background:#1a1a1d}
@media print{
  body{background:#fff}
  .actions,.workspace,.context .btn,.filters,.summary,.drawer-bg,.drawer{display:none !important}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .results{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">TAIT</div>
    <div>
      <h1>Equipment Index</h1>
      <p>Internal product selector for Kinesys and TAIT Classic automation systems</p>
    </div>
  </div>

  <div class="workspace">
    <div class="eyebrow">Workspace</div>
    <div class="navgrid" id="nav"></div>
  </div>

  <div class="context">
    <div>
      <h2 id="contextTitle">All equipment</h2>
      <p id="contextSub">Filter by brand, rating, capacity, speed and duty.</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="copySummary()">Copy shortlist</button>
      <button class="btn" onclick="exportShortlist()">Export shortlist</button>
      <button class="btn" onclick="togglePresent()">Presentation mode</button>
      <button class="btn primary" onclick="window.print()">Print / PDF</button>
    </div>
  </div>

  <div class="panel">
    <div class="filters">
      <div class="field col-6">
        <label>Search</label>
        <input id="q" type="text" placeholder="e.g. Apex 1250, BGV-C1, Vector">
      </div>
      <div class="field col-3">
        <label>Sort by</label>
        <select id="sort">
          <option value="name">Name (A-Z)</option>
          <option value="cap-desc">Capacity (high-low)</option>
          <option value="cap-asc">Capacity (low-high)</option>
          <option value="spd-desc">Speed (high-low)</option>
        </select>
      </div>
      <div class="field col-3">
        <label>View</label>
        <select id="view">
          <option value="all">All products</option>
          <option value="shortlist">Shortlist only</option>
        </select>
      </div>
      <div class="field col-12">
        <label>Brand</label>
        <div class="chips" id="brandChips"></div>
      </div>
      <div class="field col-12">
        <label>Safety / duty rating</label>
        <div class="chips" id="ratingChips"></div>
      </div>
      <div class="field col-6">
        <label>Minimum capacity (kg)</label>
        <div class="range-row">
          <input id="minCap" type="range" min="0" max="5000" step="50" value="0">
          <div class="range-val"><span id="minCapVal">0</span> kg</div>
        </div>
      </div>
      <div class="field col-6">
        <label>Minimum speed (m/min)</label>
        <div class="range-row">
          <input id="minSpd" type="range" min="0" max="120" step="1" value="0">
          <div class="range-val"><span id="minSpdVal">0</span> m/min</div>
        </div>
      </div>
      <div class="field col-12">
        <label>Application</label>
        <div class="chips" id="appChips"></div>
      </div>
    </div>
    <div class="summary">
      <div class="count"><b id="resultCount">0</b> products match &middot; <span id="shortlistCount">0</span> on shortlist</div>
      <div><button class="chip" onclick="resetFilters()">Reset filters</button></div>
    </div>
  </div>

  <div class="results" id="results"></div>
</div>

<div class="drawer-bg" id="drawerBg" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <div>
      <div class="eyebrow" id="dCat"></div>
      <h3 id="dName"></h3>
    </div>
    <button class="closebtn" onclick="closeDrawer()">&times;</button>
  </header>
  <div class="body" id="dBody"></div>
  <div class="footer">
    <button class="btn" onclick="toggleShortlistFromDrawer()" id="dShortBtn">Add to shortlist</button>
    <button class="btn primary" onclick="copyProductSpec()">Copy spec</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

</script>

<script>
const STORE = 'taitEquipmentIndex.v2';
const state = (function(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e){}
  s.cat = s.cat || 'all';
  s.q = s.q || '';
  s.minCap = +s.minCap || 0;
  s.minSpd = +s.minSpd || 0;
  s.brand = s.brand || [];
  s.rating = s.rating || [];
  s.apps = s.apps || [];
  s.sort = s.sort || 'name';
  s.view = s.view || 'all';
  s.shortlist = s.shortlist || [];
  s.present = !!s.present;
  return s;
})();
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

function brandSlug(b){ return b === 'Kinesys' ? 'kinesys' : (b === 'TAIT Classic' ? 'tait' : 'generic'); }

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  CATEGORIES.forEach((c)=>{
    let count;
    if (c.id==='all') count = PRODUCTS.length;
    else if (c.id==='shortlist') count = state.shortlist.length;
    else if (c.id==='kinesys') count = PRODUCTS.filter(p=>p.brand==='Kinesys').length;
    else if (c.id==='tait')    count = PRODUCTS.filter(p=>p.brand==='TAIT Classic').length;
    else count = PRODUCTS.filter(p=>p.cat===c.id).length;
    const btn = document.createElement('button');
    btn.className = 'navbtn' + (state.cat===c.id ? ' active' : '');
    btn.innerHTML = '<span class="dot"></span><span class="label">'+c.label+'</span><span class="meta">'+(count||'')+'</span>';
    btn.onclick = ()=>{ state.cat=c.id; save(); renderAll(); };
    nav.appendChild(btn);
  });
}

function renderChips(containerId, list, selected, onToggle){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  list.forEach(v=>{
    const c = document.createElement('button');
    c.className = 'chip' + (selected.includes(v) ? ' active' : '');
    c.textContent = v;
    c.onclick = ()=>onToggle(v);
    el.appendChild(c);
  });
}

function matches(p){
  if (state.cat === 'kinesys' && p.brand !== 'Kinesys') return false;
  if (state.cat === 'tait'    && p.brand !== 'TAIT Classic') return false;
  if (state.cat === 'shortlist' && !state.shortlist.includes(p.id)) return false;
  if (state.cat !== 'all' && state.cat !== 'shortlist' && state.cat !== 'kinesys' && state.cat !== 'tait'){
    if (p.cat !== state.cat) return false;
  }
  if (state.view === 'shortlist' && !state.shortlist.includes(p.id)) return false;
  if (state.q) {
    const hay = (p.name+' '+p.blurb+' '+(p.detail||'')+' '+p.rating.join(' ')+' '+p.apps.join(' ')+' '+p.brand).toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  if (state.minCap && (!p.capacity || p.capacity < state.minCap)) return false;
  if (state.minSpd && (!p.speed || p.speed < state.minSpd)) return false;
  if (state.brand.length && !state.brand.includes(p.brand)) return false;
  if (state.rating.length && !state.rating.every(r => p.rating.includes(r))) return false;
  if (state.apps.length && !state.apps.every(a => p.apps.includes(a))) return false;
  return true;
}
function sortFn(a,b){
  switch(state.sort){
    case 'cap-desc': return (b.capacity||0) - (a.capacity||0);
    case 'cap-asc' : return (a.capacity||0) - (b.capacity||0);
    case 'spd-desc': return (b.speed||0) - (a.speed||0);
    default: return a.name.localeCompare(b.name);
  }
}

function fmtCap(v){ if(v===null) return 'varies'; if(!v) return '-'; return v+' kg'; }
function fmtSpd(v){ if(v===null) return 'varies'; if(!v) return '-'; return v+' m/min'; }

function renderResults(){
  const list = PRODUCTS.filter(matches).sort(sortFn);
  document.getElementById('resultCount').textContent = list.length;
  document.getElementById('shortlistCount').textContent = state.shortlist.length;
  const wrap = document.getElementById('results');
  wrap.innerHTML = '';
  list.forEach(p=>{
    const card = document.createElement('article');
    card.className = 'card';
    const catLabel = (CATEGORIES.find(c=>c.id===p.cat)||{label:p.cat}).label || p.cat;
    const bSlug = brandSlug(p.brand);
    card.innerHTML =
      '<span class="brand-pill '+bSlug+'">'+p.brand+'</span>'+
      '<div class="cat">'+catLabel+'</div>'+
      '<h3>'+p.name+'</h3>'+
      '<div class="blurb">'+p.blurb+'</div>'+
      (p.verify===false ? '<div class="verify-flag">! Specs unverified - confirm from internal docs</div>' : '')+
      '<div class="specs">'+
        '<div class="spec"><div class="k">Capacity</div><div class="v">'+fmtCap(p.capacity)+'</div></div>'+
        '<div class="spec"><div class="k">Speed</div><div class="v">'+fmtSpd(p.speed)+'</div></div>'+
        '<div class="spec"><div class="k">Voltage</div><div class="v" style="font-size:13px">'+(p.voltage||'-')+'</div></div>'+
      '</div>'+
      (p.rating.length ? '<div class="tags">'+p.rating.map(r=>'<span class="tag">'+r+'</span>').join('')+'</div>' : '')+
      '<div class="cardfoot">'+
        '<button class="linklike" data-id="'+p.id+'" data-act="detail">View detail</button>'+
        '<button class="chip '+(state.shortlist.includes(p.id)?'active':'')+'" data-id="'+p.id+'" data-act="short">'+(state.shortlist.includes(p.id)?'On shortlist':'+ shortlist')+'</button>'+
      '</div>';
    wrap.appendChild(card);
  });
  wrap.querySelectorAll('[data-act=detail]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.id));
  wrap.querySelectorAll('[data-act=short]').forEach(b=>b.onclick=()=>toggleShortlist(b.dataset.id));
}

let drawerCurrent = null;
function openDrawer(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  drawerCurrent = p;
  document.getElementById('dCat').textContent = ((CATEGORIES.find(c=>c.id===p.cat)||{}).label || p.cat) + ' · ' + p.brand;
  document.getElementById('dName').textContent = p.name;
  const body = document.getElementById('dBody');
  body.innerHTML =
    '<p style="color:var(--ink-soft);font-size:14.5px;margin:0 0 14px">'+p.blurb+'</p>'+
    '<p style="font-size:14px;margin:0 0 14px">'+(p.detail||'')+'</p>'+
    (p.verify===false ? '<div class="verify-flag" style="margin:0 0 10px">! Specs unverified - confirm from internal TAIT documentation before use</div>' : '')+
    '<table class="specs-table">'+
      '<tr><td>Brand</td><td>'+p.brand+'</td></tr>'+
      '<tr><td>Capacity</td><td>'+fmtCap(p.capacity)+'</td></tr>'+
      '<tr><td>Speed</td><td>'+fmtSpd(p.speed)+'</td></tr>'+
      '<tr><td>Voltage</td><td>'+(p.voltage||'-')+'</td></tr>'+
      '<tr><td>Unit weight</td><td>'+(p.weight ? p.weight+' kg' : 'n/a')+'</td></tr>'+
      '<tr><td>Rating</td><td>'+(p.rating.length ? p.rating.join(', ') : '-')+'</td></tr>'+
      '<tr><td>Applications</td><td>'+p.apps.join(', ')+'</td></tr>'+
    '</table>'+
    (p.source ? '<div class="source-note"><b>Source:</b> '+p.source+'</div>' : '');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBg').classList.add('open');
  document.getElementById('dShortBtn').textContent = state.shortlist.includes(p.id) ? 'Remove from shortlist' : 'Add to shortlist';
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBg').classList.remove('open');
  drawerCurrent = null;
}
function toggleShortlist(id){
  const i = state.shortlist.indexOf(id);
  if (i>=0) state.shortlist.splice(i,1); else state.shortlist.push(id);
  save(); renderAll();
  if (drawerCurrent && drawerCurrent.id===id){
    document.getElementById('dShortBtn').textContent = state.shortlist.includes(id) ? 'Remove from shortlist' : 'Add to shortlist';
  }
}
function toggleShortlistFromDrawer(){ if(drawerCurrent) toggleShortlist(drawerCurrent.id); }

function copyProductSpec(){
  if(!drawerCurrent) return;
  const p = drawerCurrent;
  const txt = [p.name+' ['+p.brand+']', p.blurb, '',
    'Capacity: '+fmtCap(p.capacity),
    'Speed: '+fmtSpd(p.speed),
    'Voltage: '+(p.voltage||'-'),
    'Rating: '+(p.rating.join(', ')||'-'),
    'Applications: '+p.apps.join(', '),
    '', p.detail||'',
    p.source ? '\nSource: '+p.source : ''].join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Spec copied'));
}
function copySummary(){
  if(!state.shortlist.length){ toast('Shortlist is empty'); return; }
  const lines = ['TAIT Equipment Index - Shortlist',''];
  state.shortlist.forEach(id=>{
    const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
    lines.push('- ['+p.brand+'] '+p.name+' ('+p.rating.join('/')+') - '+fmtCap(p.capacity)+' @ '+fmtSpd(p.speed));
  });
  navigator.clipboard.writeText(lines.join('\n')).then(()=>toast('Shortlist copied'));
}
function exportShortlist(){
  const blob = new Blob([JSON.stringify({shortlist: state.shortlist, products: PRODUCTS.filter(p=>state.shortlist.includes(p.id))}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'equipment-shortlist.json';
  a.click();
}
function togglePresent(){
  state.present = !state.present; save();
  document.body.classList.toggle('present', state.present);
  toast(state.present ? 'Presentation mode on' : 'Presentation mode off');
}
function resetFilters(){
  state.q=''; state.minCap=0; state.minSpd=0; state.brand=[]; state.rating=[]; state.apps=[]; state.sort='name'; state.view='all';
  save(); renderAll(); document.getElementById('q').value='';
  document.getElementById('minCap').value=0; document.getElementById('minSpd').value=0;
  document.getElementById('minCapVal').textContent='0'; document.getElementById('minSpdVal').textContent='0';
  document.getElementById('sort').value='name'; document.getElementById('view').value='all';
  toast('Filters reset');
}

function renderContext(){
  const c = CATEGORIES.find(x=>x.id===state.cat) || CATEGORIES[0];
  document.getElementById('contextTitle').textContent = c.label;
  let sub = 'Filter by brand, rating, capacity, speed and duty.';
  if (c.id==='kinesys') sub = 'Kinesys product range - verified specs from kinesys.com.';
  else if (c.id==='tait') sub = 'TAIT Classic - product names verified, detailed specs flagged for internal verification.';
  else if (c.id==='shortlist') sub = 'Compare, copy or export the units you are considering.';
  document.getElementById('contextSub').textContent = sub;
}

function renderAll(){
  renderNav();
  renderContext();
  renderChips('brandChips', BRANDS, state.brand, v=>{
    const i=state.brand.indexOf(v); if(i>=0) state.brand.splice(i,1); else state.brand.push(v); save(); renderAll();
  });
  renderChips('ratingChips', RATINGS, state.rating, v=>{
    const i=state.rating.indexOf(v); if(i>=0) state.rating.splice(i,1); else state.rating.push(v); save(); renderAll();
  });
  renderChips('appChips', APPS, state.apps, v=>{
    const i=state.apps.indexOf(v); if(i>=0) state.apps.splice(i,1); else state.apps.push(v); save(); renderAll();
  });
  renderResults();
}

function init(){
  document.getElementById('q').addEventListener('input', e=>{state.q=e.target.value; save(); renderResults();});
  document.getElementById('minCap').addEventListener('input', e=>{state.minCap=+e.target.value; document.getElementById('minCapVal').textContent=e.target.value; save(); renderResults();});
  document.getElementById('minSpd').addEventListener('input', e=>{state.minSpd=+e.target.value; document.getElementById('minSpdVal').textContent=e.target.value; save(); renderResults();});
  document.getElementById('sort').addEventListener('change', e=>{state.sort=e.target.value; save(); renderResults();});
  document.getElementById('view').addEventListener('change', e=>{state.view=e.target.value; save(); renderResults();});
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
  document.getElementById('q').value = state.q;
  document.getElementById('minCap').value = state.minCap;
  document.getElementById('minSpd').value = state.minSpd;
  document.getElementById('minCapVal').textContent = state.minCap;
  document.getElementById('minSpdVal').textContent = state.minSpd;
  document.getElementById('sort').value = state.sort;
  document.getElementById('view').value = state.view;
  if (state.present) document.body.classList.add('present');
  renderAll();
}
init();
</script>
</body>
